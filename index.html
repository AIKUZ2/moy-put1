<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B33" media="(prefers-color-scheme: dark)">
<meta name="description" content="Привычки, английский, аффирмации и иман в одном приложении">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мой путь">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>Мой путь</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Amiri&display=swap">
<style>
/* Макет: одна колонка до 520px по центру, туманный фон на весь экран, плавающее стеклянное меню снизу, листы-окна снизу */
:root {
  --ivory: #FFFDF5; --lemon: #E7F1AB; --mist: #D0D9F5; --sky: #95B1EE; --midnight: #364C84; --charcoal: #333333;
  --bg: #FFFDF5; --text: #333333; --muted: #5B6275;
  --accent: #364C84; --on-accent: #FFFFFF;
  --pill: #FFFFFF; --on-pill: #333333;
  --glass: rgba(255,255,255,.55); --glass-strong: rgba(255,255,255,.82); --glass-line: rgba(255,255,255,.85);
  --sheet: rgba(255,253,245,.94);
  --hair: rgba(54,76,132,.13);
  --shadow: 0 10px 30px rgba(54,76,132,.10);
  --blob-sky: rgba(149,177,238,.70); --blob-mist: rgba(208,217,245,.95); --blob-lemon: rgba(231,241,171,.90);
  --ring-habits: #7A8C12; --ring-english: #3D7BE0; --ring-affirm: #7E6AD6; --ring-iman: #364C84;
  --on-ring: #FFFFFF;
  --ok: #5E7A10; --bad: #B03A48;
  --iman-top: #3A5292; --iman-bottom: #1F2B55; --iman-text: #FFFDF5; --iman-muted: #C5CEEA;
  --box: rgba(208,217,245,.55);
  --backdrop: rgba(20,27,51,.32);
  --font: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --arabic: 'Amiri', 'Geeza Pro', 'Segoe UI', 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141B33; --text: #EEF1FA; --muted: #A9B3CC;
    --accent: #95B1EE; --on-accent: #141B33;
    --pill: #EEF1FA; --on-pill: #141B33;
    --glass: rgba(255,255,255,.08); --glass-strong: rgba(255,255,255,.15); --glass-line: rgba(255,255,255,.16);
    --sheet: rgba(22,30,56,.95);
    --hair: rgba(255,255,255,.11);
    --shadow: 0 10px 30px rgba(0,0,0,.30);
    --blob-sky: rgba(149,177,238,.30); --blob-mist: rgba(208,217,245,.17); --blob-lemon: rgba(231,241,171,.13);
    --ring-habits: #E7F1AB; --ring-english: #95B1EE; --ring-affirm: #C4B8F6; --ring-iman: #F2DFA7;
    --on-ring: #141B33;
    --ok: #C9DE6E; --bad: #FF9AA6;
    --iman-top: #26386E; --iman-bottom: #10172F;
    --box: rgba(208,217,245,.11);
    --backdrop: rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141B33; --text: #EEF1FA; --muted: #A9B3CC;
  --accent: #95B1EE; --on-accent: #141B33;
  --pill: #EEF1FA; --on-pill: #141B33;
  --glass: rgba(255,255,255,.08); --glass-strong: rgba(255,255,255,.15); --glass-line: rgba(255,255,255,.16);
  --sheet: rgba(22,30,56,.95);
  --hair: rgba(255,255,255,.11);
  --shadow: 0 10px 30px rgba(0,0,0,.30);
  --blob-sky: rgba(149,177,238,.30); --blob-mist: rgba(208,217,245,.17); --blob-lemon: rgba(231,241,171,.13);
  --ring-habits: #E7F1AB; --ring-english: #95B1EE; --ring-affirm: #C4B8F6; --ring-iman: #F2DFA7;
  --on-ring: #141B33;
  --ok: #C9DE6E; --bad: #FF9AA6;
  --iman-top: #26386E; --iman-bottom: #10172F;
  --box: rgba(208,217,245,.11);
  --backdrop: rgba(0,0,0,.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100%; background-color: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* фон вкладок */
#bg { position: fixed; inset: 0; z-index: -1; background: var(--bg); }
body.t-today #bg { background:
  radial-gradient(120% 55% at 0% 0%, var(--blob-mist), transparent 62%),
  radial-gradient(90% 48% at 100% 32%, var(--blob-sky), transparent 62%),
  radial-gradient(110% 50% at 10% 100%, var(--blob-lemon), transparent 62%), var(--bg); }
body.t-habits #bg { background:
  radial-gradient(140% 58% at 25% 0%, var(--blob-lemon), transparent 66%),
  radial-gradient(90% 45% at 100% 72%, var(--blob-mist), transparent 62%), var(--bg); }
body.t-english #bg { background:
  radial-gradient(130% 55% at 85% 0%, var(--blob-sky), transparent 64%),
  radial-gradient(100% 50% at 0% 85%, var(--blob-mist), transparent 62%), var(--bg); }
body.t-english.e-reading #bg { background: var(--bg); }
body.t-affirm #bg { background:
  radial-gradient(130% 60% at 25% 6%, var(--blob-mist), transparent 66%),
  radial-gradient(80% 40% at 100% 58%, var(--blob-sky), transparent 62%),
  radial-gradient(100% 45% at 0% 100%, var(--blob-mist), transparent 62%), var(--bg); }
body.t-iman {
  --text: var(--iman-text); --muted: var(--iman-muted);
  --glass: rgba(255,255,255,.10); --glass-strong: rgba(255,255,255,.18); --glass-line: rgba(255,255,255,.22);
  --accent: var(--ivory); --on-accent: var(--midnight);
  --pill: var(--ivory); --on-pill: var(--midnight);
  --hair: rgba(255,255,255,.15); --shadow: none;
  --sheet: rgba(28,40,80,.96); --box: rgba(255,255,255,.10);
  --ok: #E7F1AB; --bad: #FFB3BC;
  color-scheme: dark;
}
body.t-iman #bg { background:
  radial-gradient(90% 42% at 100% 0%, rgba(149,177,238,.32), transparent 62%),
  radial-gradient(80% 35% at 0% 70%, rgba(208,217,245,.10), transparent 62%),
  linear-gradient(180deg, var(--iman-top), var(--iman-bottom)); }

.wrap {
  max-width: 520px; margin: 0 auto;
  padding-block: 14px 136px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}

/* общие детали */
.glass { background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%); border: 1px solid var(--glass-line); border-radius: 26px; box-shadow: var(--shadow); }
.card { padding: 16px; }
.stack { display: grid; gap: 10px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 40px; }
.mark { width: 30px; height: 30px; color: var(--accent); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; width: max-content; max-width: 100%;
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  font-size: 12px; font-weight: 500; line-height: 1.25;
}
button.chip { cursor: pointer; }
.chip[aria-pressed="true"], .chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-block: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrapchips { flex-wrap: wrap; overflow: visible; margin-inline: 0; padding-inline: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 11px 18px; border: 1px solid transparent; font-size: 14px; font-weight: 500; line-height: 1.15; text-align: center; }
.btn .ico { width: 18px; height: 18px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-pill { background: var(--pill); color: var(--on-pill); box-shadow: 0 4px 14px rgba(20,27,51,.08); }
.btn-glass { background: var(--glass); border-color: var(--glass-line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.btn-plain { background: none; padding: 6px 4px; color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
.round { width: 40px; height: 40px; padding: 0; flex: none; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { border: 0; background: transparent; padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--pill); color: var(--on-pill); box-shadow: 0 2px 10px rgba(20,27,51,.10); }
.hello { margin: 4px 0 0; font-size: 38px; font-weight: 700; letter-spacing: -0.045em; line-height: 1.02; text-wrap: balance; }
.title { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; }
.sub { margin: 6px 0 0; font-size: 14px; font-weight: 500; }
.small { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
p { margin: 0; }
.sec { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 6px; padding-inline: 2px; }
.sec b { font-size: 16px; font-weight: 700; }
.link { border: 0; background: none; padding: 4px 0; font-size: 13px; font-weight: 500; color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
.h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; text-wrap: balance; }
.empty { padding: 18px 16px; text-align: center; color: var(--muted); font-size: 14px; }
.field {
  width: 100%; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--muted);
  background: var(--glass-strong); font-size: 16px; line-height: 1.4;
}
textarea.field { resize: vertical; min-height: 92px; }
.field:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
label.lbl { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
.pre { white-space: pre-wrap; }
.okc { color: var(--ok); } .badc { color: var(--bad); }

/* кольца */
.rings { display: flex; align-items: center; gap: 14px; }
.rings svg { width: 118px; height: 118px; flex: none; }
.rings circle { fill: none; stroke-width: 8.5; }
.rings .track { opacity: .18; }
.rings .prog { stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; flex: 1; min-width: 0; }
.legend li { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.legend .dot { width: 9px; height: 9px; border-radius: 50%; }
.legend b { font-weight: 500; font-variant-numeric: tabular-nums; }

/* аффирмация */
.aff-text { margin: 12px 0 14px; font-size: 20px; font-weight: 500; line-height: 1.3; letter-spacing: -0.01em; text-wrap: balance; }
.dots { display: inline-flex; gap: 5px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .25; }
.dots i.on { opacity: 1; background: var(--ring-affirm); }

/* строки привычек */
.list { padding: 2px 14px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 0; background: none; border: 0; border-bottom: 1px solid var(--hair); text-align: left; }
.row:last-child { border-bottom: 0; }
.check { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; display: grid; place-items: center; color: transparent; background: none; padding: 0; transition: background .2s, border-color .2s; }
.check .ico { width: 16px; height: 16px; }
.row.on .check { background: var(--ring-habits); border-color: var(--ring-habits); color: var(--on-ring); }
.row .name { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; }
.row.on .name { color: var(--muted); }
.meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass-strong); font-size: 18px; line-height: 1; padding: 0; flex: none; }

/* иман на главной */
.iman-mini { --pill: var(--ivory); --on-pill: var(--midnight); border-radius: 26px; padding: 16px; color: var(--iman-text);
  background: radial-gradient(90% 70% at 100% 0%, rgba(149,177,238,.35), transparent 60%), linear-gradient(160deg, var(--iman-top), var(--iman-bottom)); }
.iman-mini .small { color: var(--iman-muted); }
.iman-mini h4 { margin: 8px 0 10px; font-size: 21px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.12; text-wrap: balance; }
.quote { margin: 0 0 12px; font-size: 15px; line-height: 1.45; }
.quote cite { display: block; margin-top: 4px; font-style: normal; font-size: 12px; color: var(--iman-muted); }
.iman-mini .btn-glass { border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.12); color: var(--iman-text); }

/* привычки */
.habit-card { display: grid; gap: 12px; }
.habit-card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.habit-card .top button { border: 0; background: none; padding: 0; text-align: left; font-size: 15px; font-weight: 700; min-width: 0; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
.week span, .cal span { font-size: 11px; color: var(--muted); font-weight: 500; }
.cell { display: block; width: 28px; height: 28px; margin: 4px auto 0; border-radius: 50%; border: 1.5px solid var(--hair); background: none; padding: 0; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cell.on { background: var(--ring-habits); border-color: var(--ring-habits); color: var(--on-ring); }
.cell.off { opacity: .35; border-style: dashed; }
.cell.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
.cal .cell { margin-top: 2px; }
.bars { display: grid; gap: 4px; align-items: end; height: 96px; margin-top: 12px; }
.bars div { display: grid; gap: 6px; justify-items: center; align-self: end; }
.bars i { display: block; width: 100%; max-width: 22px; border-radius: 7px; background: var(--ring-affirm); opacity: .85; }
.bars i.none { height: 4px; opacity: .25; background: var(--muted); }
.bars span { font-size: 10.5px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; min-height: 14px; }
.tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tool { padding: 12px 10px; display: grid; gap: 6px; border-radius: 20px; text-align: left; }
.tool .ico { color: var(--accent); }
.tool b { font-size: 13px; font-weight: 700; }
.tool span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* english */
.weeks { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px; }
.weeks::-webkit-scrollbar { display: none; }
.wk { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass); font-weight: 700; font-size: 14px; position: relative; }
.wk.cur::after { content: ''; position: absolute; bottom: 4px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; }
.wk[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
.days button { border: 0; background: none; padding: 4px 0; display: grid; gap: 4px; justify-items: center; font-size: 12px; font-weight: 500; }
.days i { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; color: transparent; }
.days i .ico { width: 15px; height: 15px; }
.days .done i { background: var(--ring-english); border-color: var(--ring-english); color: var(--on-ring); }
.days .bonus { color: var(--muted); }
.days .bonus i { border-style: dashed; }
.days [aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.lesson h4 { margin: 10px 0 6px; font-size: 24px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.12; text-wrap: balance; }
.lesson p { font-size: 15px; line-height: 1.5; }
.gblock { border-top: 1px solid var(--hair); padding-top: 12px; display: grid; gap: 6px; }
.gblock b { font-size: 16px; }
.form { font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 10px; background: var(--box); width: max-content; max-width: 100%; }
.ex { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; }
.ex li { font-size: 14.5px; line-height: 1.4; padding-left: 12px; border-left: 2px solid var(--ring-english); }
.ex li span { display: block; font-size: 12.5px; color: var(--muted); }
.tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; }
.tips s { color: var(--bad); text-decoration-thickness: 1.5px; }
.tips b { color: var(--ok); font-weight: 600; }
.phr { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.phr:last-child { border-bottom: 0; }
.phr div { flex: 1; min-width: 0; font-size: 15px; line-height: 1.35; }
.phr div span { display: block; font-size: 12.5px; color: var(--muted); }
.speak { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass-strong); display: grid; place-items: center; padding: 0; flex: none; }
.speak .ico { width: 17px; height: 17px; }
.q { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.q:last-child { border-bottom: 0; }
.q p { font-size: 15px; font-weight: 500; }
.opt { text-align: left; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--hair); background: var(--glass); font-size: 14.5px; line-height: 1.3; }
.opt.right { background: var(--blob-lemon); border-color: var(--ring-habits); color: var(--text); }
.opt.wrong { color: var(--muted); text-decoration: line-through; }
.why { font-size: 12.5px; color: var(--muted); }
.answer { font-size: 15px; line-height: 1.55; white-space: pre-wrap; padding: 12px 14px; border-radius: 16px; background: var(--box); }
.mistake { display: grid; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: 14.5px; }
.mistake:last-child { border-bottom: 0; }
.mistake s { color: var(--bad); }
.mistake b { color: var(--ok); font-weight: 600; }
.score { font-size: 44px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }

/* чат */
.chat { display: grid; gap: 8px; }
.bub { max-width: 88%; padding: 10px 13px; border-radius: 18px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; }
.bub.ai { background: var(--glass-strong); border: 1px solid var(--glass-line); border-bottom-left-radius: 6px; }
.bub.me { justify-self: end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 6px; }
.bub .fix { display: block; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--hair); font-size: 13.5px; color: var(--muted); }
.bub .fix b { color: var(--text); font-weight: 600; }
.bub-tools { display: flex; gap: 6px; margin-top: 6px; }
.composer { position: sticky; bottom: calc(-24px - env(safe-area-inset-bottom, 0px)); padding-block: 10px calc(4px + env(safe-area-inset-bottom, 0px)); background: var(--sheet); display: grid; gap: 6px; }
.composer .row2 { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { min-height: 48px; max-height: 140px; }

/* аффирмации */
.aff-big { min-height: 300px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; padding: 20px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.aff-big p { font-size: 27px; font-weight: 500; line-height: 1.22; letter-spacing: -0.025em; text-wrap: balance; }
.aff-big .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 10px; font-size: 14.5px; }
.step i { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; flex: none; color: transparent; }
.step i.on { background: var(--ring-affirm); border-color: var(--ring-affirm); color: var(--on-ring); }
.step i .ico { width: 14px; height: 14px; }
.step span { flex: 1; }
.step em { font-style: normal; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fav-on { color: var(--ring-affirm); }
.fav-on .ico { fill: currentColor; }

/* иман */
.reminder h4 { margin: 12px 0; font-size: 31px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.05; text-wrap: balance; }
.reminder p { font-size: 15.5px; line-height: 1.55; color: var(--muted); }
.ayah { padding: 16px; display: grid; gap: 8px; }
.ayah p { font-size: 19px; font-weight: 500; line-height: 1.32; color: var(--text); }
.ayah cite { font-style: normal; font-size: 12.5px; color: var(--muted); }
.translit { font-size: 14px; font-style: italic; color: var(--muted); }
.names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.name-card { padding: 14px 12px; display: grid; gap: 2px; border-radius: 20px; text-align: left; }
.name-card .ar, .bigar { font-family: var(--arabic); font-size: 30px; line-height: 1.3; direction: rtl; text-align: right; }
.bigar { font-size: 56px; text-align: center; }
.name-card b { font-size: 14px; font-weight: 700; }
.name-card span { font-size: 12.5px; color: var(--muted); }
.dua { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 20px; font-size: 15px; }
.dua > span { flex: 1; min-width: 0; }
.rem-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--hair); background: none; text-align: left; font-size: 15px; font-weight: 500; }
.rem-row:last-child { border-bottom: 0; }
.rem-row span { flex: 1; min-width: 0; }

/* чтение */
.mag-head { margin: 4px 0 0; font-family: var(--serif); font-size: 42px; font-weight: 500; letter-spacing: -0.01em; line-height: 1; }
.tag { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
.cover { background: var(--box); border-radius: 26px; padding: 18px; display: grid; gap: 8px; border: 0; text-align: left; width: 100%; }
.cover-title { font-family: var(--serif); font-size: 29px; font-weight: 500; line-height: 1.05; text-wrap: balance; }
.cover-meta { font-size: 13px; color: var(--muted); }
.mag-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--hair); background: none; text-align: left; }
.mag-row:last-child { border-bottom: 0; }
.mag-row > div { min-width: 0; }
.mag-row b { display: block; font-family: var(--serif); font-size: 17px; font-weight: 500; line-height: 1.2; }
.mag-row span { font-size: 12px; color: var(--muted); }
.mag-row .done-mark { flex: none; color: var(--text); padding: 4px 10px; border-radius: 999px; background: var(--box); }
.mag { display: grid; gap: 16px; }
.mag-title { margin: 0; font-family: var(--serif); font-size: 36px; font-weight: 500; line-height: 1.04; letter-spacing: -0.015em; text-wrap: balance; }
.level { width: max-content; padding-bottom: 8px; border-bottom: 1px solid var(--text); font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
.mag-body { display: grid; gap: 12px; }
.mag-body p { font-size: 16px; line-height: 1.65; }
.dropcap::first-letter { float: left; font-family: var(--serif); font-size: 62px; line-height: .78; padding: 7px 8px 0 0; font-weight: 500; }
.kw { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-decoration: underline dotted var(--ring-english); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.kw.saved { text-decoration-style: solid; }
.pull { margin: 2px 0; padding: 16px 16px 18px; background: var(--box); border-radius: 20px; font-size: 12px; font-weight: 500; letter-spacing: .1em; line-height: 1.6; text-transform: uppercase; }
.pull span { display: block; height: 22px; font-family: var(--serif); font-size: 46px; line-height: .9; letter-spacing: 0; }
.caps { margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.kwords dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px 14px; }
.kwords dt { font-weight: 700; font-style: italic; font-size: 14px; line-height: 1.4; }
.kwords dd { margin: 0; font-size: 13.5px; line-height: 1.4; }
.kwords dd span { display: block; color: var(--muted); font-size: 12.5px; }
.disc { margin: 0 0 12px; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; line-height: 1.45; }
.mag-foot { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 15px; padding-top: 4px; }
.mag-foot i { flex: 1; height: 1px; background: var(--text); opacity: .4; }
.wordpop { position: sticky; bottom: calc(-24px - env(safe-area-inset-bottom, 0px)); margin-inline: -4px; padding: 16px; display: grid; gap: 4px; background: var(--glass-strong); z-index: 2; }
.wordpop b { font-family: var(--serif); font-size: 23px; font-weight: 500; line-height: 1.15; }

/* карточки слов */
.flash { min-height: 260px; display: grid; place-items: center; text-align: center; padding: 24px; gap: 10px; }
.flash .w { font-family: var(--serif); font-size: 36px; font-weight: 500; line-height: 1.1; }
.flash .ru { font-size: 20px; font-weight: 500; }
.boxes { display: inline-flex; gap: 3px; }
.boxes i { width: 6px; height: 6px; border-radius: 50%; background: var(--hair); }
.boxes i.on { background: var(--ring-english); }
.wrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.wrow:last-child { border-bottom: 0; }
.wrow > div { flex: 1; min-width: 0; }
.wrow b { font-size: 15px; }
.wrow span { display: block; font-size: 12.5px; color: var(--muted); }
.x { width: 30px; height: 30px; border-radius: 50%; border: 0; background: none; color: var(--muted); font-size: 18px; padding: 0; flex: none; }

/* дыхание и помодоро */
.breath { display: grid; place-items: center; gap: 16px; padding: 10px 0 4px; }
.circle { width: 220px; height: 220px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, var(--blob-mist), var(--blob-sky)); transform: scale(.55); transition: transform 1s ease-in-out; box-shadow: var(--shadow); }
.circle b { font-size: 22px; font-weight: 700; color: var(--charcoal); }
.timer { font-size: 72px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }

/* нижнее меню */
.nav { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(500px, calc(100% - 24px)); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px; border-radius: 30px; }
.nav button { display: grid; justify-items: center; gap: 3px; padding: 7px 0 6px; border: 0; border-radius: 22px; background: none; font-size: 10.5px; font-weight: 500; letter-spacing: -0.01em; color: var(--muted); white-space: nowrap; }
.nav button[aria-current="page"] { color: var(--text); background: var(--glass-strong); }

/* листы */
#sheetWrap { position: fixed; inset: 0; z-index: 30; }
.backdrop { position: absolute; inset: 0; background: var(--backdrop); border: 0; padding: 0; width: 100%; cursor: default; }
#sheet {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: min(560px, 100%); max-height: 90%;
  overflow-y: auto; overscroll-behavior: contain;
  border-radius: 28px 28px 0 0; background: var(--sheet);
  -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  box-shadow: 0 -10px 40px rgba(20,27,51,.18);
  display: flex; flex-direction: column; gap: 14px;
}
#sheet.full { height: 100%; max-height: 100%; border-radius: 0; }
.sh-head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; background: var(--sheet); }
#sheet.full .sh-head { padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
.sh-head b { flex: 1; min-width: 0; font-size: 17px; font-weight: 700; }
#toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: max-content; max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 16px; background: var(--accent); color: var(--on-accent); font-size: 14px; box-shadow: var(--shadow); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

        'So what helps? First, make the first step tiny: "open the document and write one sentence." Starting is usually the hardest part. Second, be kind to yourself. Research suggests that people who forgive themselves for procrastinating are less likely to do it again, while harsh {{self-criticism|2}} makes the bad feeling, and the delay, worse.',
        'Finally, remove {{distractions|3}}. Put your phone in another room for 25 minutes. You don\'t need more {{willpower|4}}; you need fewer temptations.'

      paras: [
        'We spend about a third of our lives asleep, but many of us don\'t get enough. Health experts say most adults need between seven and nine hours a night.',

      paras: [
        'You are trying to fall asleep, and suddenly your brain shows you a moment from five years ago: the time you waved at someone who was waving at another person. You feel your face go hot. Why does your memory keep these moments so carefully?',
        'Part of the answer is emotion. Events that make us feel strong emotions are stored more {{vividly|0}} than ordinary ones. A small part of the brain called the amygdala helps to mark these memories as important, so they stay with us.',
        'From an evolutionary point of view, this makes sense. For our ancestors, being {{rejected|1}} by the group was dangerous. Remembering social mistakes helped people avoid repeating them.',

      paras: [
        'About sixty percent of the adult human body is water. We lose some of it every day when we breathe, sweat and go to the toilet, so we need to replace it.',

      title: 'Why Does Coffee Wake You Up?',
      paras: [
        'From the moment you wake up, a chemical called adenosine slowly {{builds up|0}} in your brain. The more of it there is, the more tired you feel. By the evening, it\'s telling you: time to sleep.',
        'Caffeine has a clever trick. Its shape is similar to adenosine, so it can sit in the same receptors, the "doors" that adenosine normally uses. But caffeine doesn\'t make you tired. It simply {{blocks|1}} the door. Your brain doesn\'t get the "tired" signal, so you feel more awake.',

      paras: [

      title: 'Why Do We Have Wisdom Teeth?',
      paras: [
        'Wisdom teeth are the third molars, the last teeth at the very back of the mouth. They usually appear between the ages of seventeen and twenty-five, when people are supposedly a little wiser, hence the name.',

        'Impacted wisdom teeth can cause pain, {{infection|2}} or damage to the neighbouring tooth. Food can get trapped around them, and they are hard to clean. In such cases, the dentist may recommend removing them.',
        'However, not everyone needs an {{extraction|3}}. Some people\'s wisdom teeth grow in perfectly straight and cause no problems at all. Some people never develop them. Regular check-ups and X-rays help the dentist decide whether to {{keep an eye on|4}} them or take them out.'

      paras: [
        'For many people, "root canal" sounds like one of the scariest phrases in dentistry. In reality, it is a treatment that saves teeth that would otherwise be lost.',
        'Inside every tooth there is soft tissue called the pulp, which contains nerves and blood vessels. When deep decay or a crack lets bacteria reach the pulp, it can become {{inflamed|0}} or infected. This often causes strong pain, especially at night, and can lead to an abscess.',
        'During a root canal treatment, the dentist first numbs the area with a local {{anaesthetic|1}}. Then they make a small opening, remove the pulp and carefully clean and shape the narrow canals with special files. The canals are washed with {{disinfecting|2}} solutions to kill bacteria.',
        'Finally, the canals are filled and sealed, usually with a rubber-like material called gutta-percha, and the tooth is restored. Because a treated tooth can become more {{fragile|3}}, the dentist may recommend a crown to protect it.',
        'With modern anaesthesia, most patients say the procedure feels similar to having a normal filling. The real pain usually comes before the treatment, from the infection itself. A well-treated tooth can {{last|4}} for many years.'

      paras: [
        'Dental {{anxiety|0}} is very common. For some people, the sound of the drill or the smell of the clinic is enough to make their heart race. Some avoid the dentist for years, until a small problem becomes a big one.',

      paras: [
        'In Formula 1, a race can be won or lost in the pit lane. A pit stop is when a car comes in during the race to change its tyres.',

      case 'aff-cat': ui.affCat = v; saveUi(); render(); return;
      case 'aff-step': affStep(+v); return;
      case 'aff-fav': { var k = b.getAttribute('data-k'); change('main', function (m) { var i3 = m.aff.fav.indexOf(k); if (i3 >= 0) m.aff.fav.splice(i3, 1); else m.aff.fav.push(k); }); return; }
      case 'aff-del': change('main', function (m) { m.aff.custom = m.aff.custom.filter(function (x) { return x.id !== id; }); m.aff.fav = m.aff.fav.filter(function (x) { return x !== 'c:' + id; }); }); ui.confirm = null; return;
      case 'aff-save': {
        var ru = ($('#aff-ru').value || '').trim(), en = ($('#aff-en').value || '').trim();
        if (!ru && !en) { toast('Напиши аффирмацию хотя бы на одном языке'); return; }
        change('main', function (m) { m.aff.custom.push({ id: uid('a'), ru: ru || en, en: en }); });
        ui.affCat = 'mine'; ui.affIdx.mine = D('main').aff.custom.length - 1; saveUi(); closeSheet(); return;
      }
      case 'intent-pick': changeDay(dd, function (d) { d.intent = v; }); return;

      case 'iman-read': changeDay(dd, function (d) { d.iman = d.iman || {}; d.iman.read = !d.iman.read; }); return;
      case 'iman-act': changeDay(dd, function (d) { d.iman = d.iman || {}; d.iman.act = !d.iman.act; }); return;
      case 'iman-fav': change('main', function (m) { var i4 = m.iman.fav.indexOf(id); if (i4 >= 0) m.iman.fav.splice(i4, 1); else m.iman.fav.push(id); }); return;
      case 'iman-theme': ui.imanTheme = v; saveUi(); render(); return;
      case 'names-all': ui.namesAll = true; render(); return;
      case 'name-step': S.i = (S.i + (+v) + IM.names.length) % IM.names.length; renderSheet(); return;
      case 'dua-add': {
        var inp = $('#dua-new'), tx = (inp.value || '').trim();
        if (!tx) { inp.focus(); return; }
        inp.value = '';
        change('main', function (m) { m.iman.duas.push({ id: uid('d'), text: tx, at: T, ok: null }); }); return;
      }
      case 'dua-ok': change('main', function (m) { m.iman.duas.forEach(function (x) { if (x.id === id) x.ok = T; }); }); toast('Альхамдулиллях!'); return;
      case 'dua-del': change('main', function (m) { m.iman.duas = m.iman.duas.filter(function (x) { return x.id !== id; }); }); ui.confirm = null; return;

      case 'go-eng': ui.tab = 'english'; ui.eng = 'course'; ui.week = +b.getAttribute('data-w'); ui.day = +b.getAttribute('data-day'); saveUi(); render(); window.scrollTo(0, 0); return;
      case 'eng-tab': ui.eng = v; saveUi(); render(); return;
      case 'week': ui.week = +b.getAttribute('data-n'); ui.day = null; render(); return;
      case 'eday': ui.day = +dd; if (!ui.week) ui.week = curWeek(); render(); return;
      case 'set-week': { var n = +b.getAttribute('data-n'); change('main', function (m) { m.settings.week = n; }); ui.week = n; ui.day = null; if (sheet) renderSheet(); return; }
      case 'skip-placement': change('main', function (m) { m.settings.placement = { skipped: true }; }); return;
      case 'eng-done': { var kk = b.getAttribute('data-k'); markEng(kk, !D('main').eng.done[kk]); return; }
      case 'test': {
        var w = +b.getAttribute('data-w'), qi = +b.getAttribute('data-q'), oi = +b.getAttribute('data-o');
        var st = mem.tests['w' + w] = mem.tests['w' + w] || {}; st[qi] = oi;
        var W = EN.weeks[w - 1], all = Object.keys(st).length === W.test.length;
        if (all) {
          var sc = W.test.filter(function (q, i) { return st[i] === q.a; }).length;
          change('main', function (m) { m.eng.tests['w' + w] = { score: sc, at: T }; }, true);
          markEng('w' + w + 'd4', true, true);
        }
        render(); return;
      }
      case 'test-reset': mem.tests['w' + b.getAttribute('data-w')] = {}; render(); return;
      case 'learn-week': {
        var wk = +b.getAttribute('data-w'), W2 = EN.weeks[wk - 1], q2 = [];
        W2.words.forEach(function (x) { q2.push(addWord(x[0], x[1], x[2], 'w' + wk)); });
        openSheet({ type: 'cards', queue: q2, i: 0, seen: 0, flip: false, week: wk }); return;
      }
      case 'learn-due': { var q3 = dueWords(T); if (!q3.length) return; openSheet({ type: 'cards', queue: q3, i: 0, seen: 0, flip: false }); return; }
      case 'card-flip': S.flip = true; renderSheet(); return;
      case 'card-know': case 'card-again': {
        var key = S.queue[S.i];
        change('main', function (m) {
          var x = m.eng.words[key]; if (!x) return;
          if (act === 'card-know') { x.box = Math.min(6, (x.box || 0) + 1); x.due = addDays(T, INTERVALS[Math.min(5, x.box - 1)]); }
          else { x.box = 0; x.due = T; }
        }, true);
        if (act === 'card-again' && !S.re) { S.re = {}; }
        if (act === 'card-again' && !S.re[key]) { S.re[key] = 1; S.queue.push(key); }
        S.seen++; S.i++; S.flip = false; renderSheet(); return;
      }
      case 'word-del': { var wk2 = b.getAttribute('data-k'); change('main', function (m) { delete m.eng.words[wk2]; }); ui.confirm = null; return; }
      case 'speak': speak(b.getAttribute('data-t')); return;
      case 'ask': askClaude(+b.getAttribute('data-w')); return;
      case 'essay-check': checkEssay(+b.getAttribute('data-w')); return;
      case 'chat-week': { var wk3 = +b.getAttribute('data-w'); var Sx = { type: 'chat', mode: 'week', wk: wk3, title: 'Разговор · неделя ' + wk3, turns: [] }; openSheet(Sx); chatCall(Sx); return; }
      case 'chat-article': { var Sy = { type: 'chat', mode: 'article', aid: id, title: 'Обсуждение статьи', turns: [] }; openSheet(Sy); chatCall(Sy); return; }
      case 'chat-send': {
        var ta = $('#chat-input'), msg = (ta.value || '').trim();
        if (!msg || S.busy) return;
        S.turns.push({ role: 'user', content: msg }); ta.value = '';
        chatCall(S); scrollChat(); return;
      }
      case 'article': openSheet({ type: 'article', id: id, quiz: {} }); return;
      case 'kw': S.kw = +b.getAttribute('data-k'); renderSheet(); return;
      case 'kw-close': delete S.kw; renderSheet(); return;
      case 'kw-save': { var a = findArticle(S.id), kwx = a.kw[S.kw]; addWord(kwx[0], kwx[2], kwx[1], 'read'); renderSheet(); toast('Слово добавлено в карточки'); return; }
      case 'aquiz': S.quiz[+b.getAttribute('data-q')] = +b.getAttribute('data-o'); renderSheet(); return;
      case 'read-done': {
        var on = !D('main').read.done[id];
        change('main', function (m) { if (on) m.read.done[id] = T; else delete m.read.done[id]; });
        if (on) { changeDay(T, function (d) { d.eng = d.eng || {}; d.eng.read = true; }); toast('Статья прочитана'); }
        return;
      }
      case 'rlevel': ui.readLevel = v; saveUi(); render(); return;
      case 'rtopic': ui.readTopic = v; saveUi(); render(); return;
      case 'gen-level': S.topic = ($('#gen-topic').value || ''); S.level = v; renderSheet(); return;
      case 'gen-go': genArticle(S); return;

      case 'theme': ui.theme = v; saveUi(); applyTheme(); renderSheet(); return;
      case 'br-mode': brStop(); br.mode = v; br.cycles = 0; renderSheet(); return;
      case 'br-toggle': if (br.run) { brStop(); renderSheet(); } else { renderSheet(); requestAnimationFrame(function () { brStart(); var bt = $('[data-act="br-toggle"]'); if (bt) bt.textContent = 'Остановить'; }); } return;
      case 'pomo-toggle': {
        if (!pomo.actx) { try { var AC = window.AudioContext || window.webkitAudioContext; if (AC) pomo.actx = new AC(); } catch (e3) {} }
        if (pomo.run) { pomo.left = pomoLeft(); pomo.run = false; clearInterval(pomo.iv); pomo.iv = null; releaseLock(); }
        else { pomo.endAt = Date.now() + pomo.left * 1000; pomo.run = true; pomo.iv = setInterval(pomoTick, 250); getLock(); }
        renderSheet(); return;
      }
      case 'pomo-reset': pomo.run = false; clearInterval(pomo.iv); pomo.iv = null; pomo.mode = 'work'; pomo.left = 25 * 60; releaseLock(); renderSheet(); return;
      case 'pl-ans': S.ans[S.i] = +b.getAttribute('data-o'); S.i++; renderSheet(); var shp = $('#sheet'); if (shp) shp.scrollTop = 0; return;
    }
  });
  function closeSheetSilently() { if (sheet && sheet.type === 'breath') brStop(); sheet = null; }

  document.addEventListener('input', function (e) {
    var el = e.target, k = el.getAttribute && el.getAttribute('data-in');
    if (!k) return;
    var v = el.value, dd = el.getAttribute('data-d');
    if (k === 'grat') { var i = +el.getAttribute('data-i'); changeDay(dd, function (d) { var g = d.grat || ['', '', '']; g[i] = v; d.grat = g; }, true); }
    else if (k === 'moodnote') changeDay(dd, function (d) { d.mood = d.mood || {}; d.mood.note = v; }, true);
    else if (k === 'intent') changeDay(dd, function (d) { d.intent = v; }, true);
    else if (k === 'evening') changeDay(dd, function (d) { d.evening = { q: eveningQ(dd), a: v }; }, true);
    else if (k === 'name') change('main', function (m) { m.settings.name = v.trim().slice(0, 40); }, true);
    else if (k === 'essay') {
      var w = el.getAttribute('data-w');
      change('essays', function (E) { var it = E.items['w' + w] || {}; it.text = v; it.at = todayStr(); E.items['w' + w] = it; }, true);
      var wc = $('#wc-w' + w); if (wc) { var n = words(v); wc.textContent = n + ' ' + plural(n, ['слово', 'слова', 'слов']); }
    }
    else if (k === 'hd' && sheet && sheet.draft) { sheet.draft[el.getAttribute('data-f')] = v; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet) closeSheet();
    if (e.key === 'Enter' && !e.shiftKey && e.target && e.target.id === 'chat-input' && window.matchMedia('(pointer:fine)').matches) { e.preventDefault(); var b = $('[data-act="chat-send"]'); if (b) b.click(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'dua-new') { e.preventDefault(); var b2 = $('[data-act="dua-add"]'); if (b2) b2.click(); }
  });

  /* ---------- Claude: объяснение, эссе, статьи ---------- */
  function askClaude(w) {
    if (!sample) return;
    var W = EN.weeks[w - 1], ta = $('#ask-w' + w), q = ta ? ta.value.trim() : '';
    var A = mem.ask['w' + w] = { busy: true, text: '' };
    render();
    var prompt = 'You are a friendly English teacher for a Russian-speaking adult learner (target level: Upper-Intermediate, B2). The grammar topic of the week is "' + W.grammar.title + '".\n'
      + (q ? 'The learner asks: "' + q + '".\n' : 'Explain this topic again in other words, with fresh everyday examples (study, dentistry, life in Moscow).\n')
      + 'Answer in Russian, briefly (up to 160 words). Give 3–4 English example sentences, each on its own line starting with "• ", with a Russian translation after a dash. No markdown, no bold, no headers.';
    sample(prompt, { onText: function (u) { var el = $('#ans-w' + w); if (el) { el.hidden = false; el.textContent = clean(u.text); } } }).then(function (res) {
      A.busy = false; A.text = clean(res.text); render();
    }, function (e) { A.busy = false; A.text = (e && e.text ? clean(e.text) + '\n\n' : '') + sampleErr(e); render(); });
  }
  function checkEssay(w) {
    if (!sample) return;
    var W = EN.weeks[w - 1], E = D('essays').items['w' + w] || {}, text = (E.text || '').trim();
    if (words(text) < 30) { mem.essayErr['w' + w] = 'Напиши хотя бы 30 слов, тогда будет что проверить.'; render(); return; }
    mem.essayBusy['w' + w] = true; mem.essayErr['w' + w] = ''; render();
    var prompt = 'You are an experienced English teacher. Check an essay written by a Russian-speaking learner who is aiming for Upper-Intermediate (B2).\n'
      + 'Task: "' + W.essay.topic + '". Grammar focus of the week: "' + W.grammar.title + '".\nEssay:\n"""\n' + text.slice(0, 6000) + '\n"""\n'
      + 'Reply with only one JSON object and no other text, in this shape:\n'
      + '{"score": 7, "level": "B1+", "summary": "2–3 sentences in Russian: what is good and what to improve", "mistakes": [{"wrong": "exact fragment from the essay", "right": "corrected fragment", "why": "short explanation in Russian"}], "improved": "the whole essay rewritten in natural B2 English, keeping the learner\'s ideas", "tips": ["2–3 short tips in Russian"]}\n'
      + 'score is from 1 to 10; level is one of A2, B1, B1+, B2, B2+, C1. List up to 10 of the most important mistakes.';
    sample.json(prompt, {}).then(function (fb) {
      mem.essayBusy['w' + w] = false;
      if (!fb || typeof fb !== 'object' || fb.score === undefined) { mem.essayErr['w' + w] = 'Claude ответил в неожиданном формате. Попробуй ещё раз.'; render(); return; }
      fb.mistakes = Array.isArray(fb.mistakes) ? fb.mistakes.slice(0, 10) : [];
      fb.tips = Array.isArray(fb.tips) ? fb.tips.slice(0, 4) : [];
      change('essays', function (Es) { var it = Es.items['w' + w] || {}; it.fb = fb; it.at = todayStr(); Es.items['w' + w] = it; });
      markEng('w' + w + 'd5', true);
    }, function (e) { mem.essayBusy['w' + w] = false; mem.essayErr['w' + w] = sampleErr(e); render(); });
  }
  function genArticle(S) {
    if (!sample || S.busy) return;
    var topic = ($('#gen-topic').value || '').trim();
    if (!topic) { S.err = 'Напиши тему статьи.'; renderSheet(); return; }
    S.topic = topic; S.busy = true; S.err = ''; renderSheet();
    var prompt = 'Write an original magazine-style article in English for a Russian-speaking learner. CEFR level: ' + S.level + '. Topic: "' + topic + '".\n'
      + 'Length: 4–5 short paragraphs, 220–320 words in total. Use facts only if you are sure they are true; if unsure, keep it general.\n'
      + 'Inside the paragraphs, mark exactly 5 useful words or phrases like {{word|n}}, where n is the index (0–4) of the word in the "kw" list; the text inside the braces must fit the sentence naturally.\n'
      + 'Reply with only one JSON object and no other text, in this shape:\n'
      + '{"title": "...", "tag": "short tagline, 3–6 words", "paras": ["...", "..."], "quote": "one short memorable sentence", "kw": [["base form", "simple English definition", "Russian translation"]], "quiz": [{"q": "...", "o": ["...", "...", "..."], "a": 0}], "disc": ["...", "...", "..."]}\n'
      + 'Give 3 quiz questions with 3 options each ("a" is the index of the correct option) and 3 discussion questions.';
    sample.json(prompt, { modelTier: 'default' }).then(function (a) {
      S.busy = false;
      var ok = a && typeof a.title === 'string' && Array.isArray(a.paras) && a.paras.length && Array.isArray(a.kw) && Array.isArray(a.quiz) && Array.isArray(a.disc);
      if (!ok) { S.err = 'Claude ответил в неожиданном формате. Попробуй ещё раз.'; renderSheet(); return; }
      var art = { id: uid('g'), gen: true, topic: 'gen', level: S.level, min: Math.max(2, Math.round(a.paras.join(' ').split(/\s+/).length / 120)), tag: String(a.tag || ''), title: a.title,
        paras: a.paras.map(String), quote: String(a.quote || ''),
        kw: a.kw.filter(function (k) { return Array.isArray(k) && k.length >= 3; }).map(function (k) { return [String(k[0]), String(k[1]), String(k[2])]; }),
        quiz: a.quiz.filter(function (q) { return q && Array.isArray(q.o) && typeof q.a === 'number'; }).map(function (q) { return { q: String(q.q), o: q.o.map(String), a: q.a }; }),
        disc: a.disc.map(String) };
      art.paras = art.paras.map(function (p) { return p.replace(/\{\{([^|}]+)\|(\d+)\}\}/g, function (m0, t, n) { return +n < art.kw.length ? m0 : t; }); });
      change('gen', function (G) { G.articles.push(art); if (G.articles.length > 30) G.articles.shift(); });
      openSheet({ type: 'article', id: art.id, quiz: {} });
    }, function (e) { S.busy = false; S.err = sampleErr(e); renderSheet(); });
  }

  /* ---------- запуск ---------- */
  applyTheme();
  ensureMonths(todayStr());
  doc('main'); doc('gen'); doc('essays');
  render();
  connect();
  var lastDay = todayStr();
  setInterval(function () { var t = todayStr(); if (t !== lastDay) { lastDay = t; requestRender(); } }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) requestRender(); });
})();
</script>

<script>
  /* Работа без интернета: на сайте (не на claude.ai) подключаем помощника sw.js */
  if (!window.claude && 'serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
